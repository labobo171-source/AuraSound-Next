<!doctype html>
<html lang="fa" dir="rtl" data-theme="neon">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030712"><title>AuraSound Ultra 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--p:#00f0ff;--glow:rgba(0,240,255,.4);--glass:rgba(13,17,23,.72);--border:rgba(0,240,255,.25);--txt:#f8fafc;--sub:#94a3b8}
:root[data-theme=cyberpunk]{--p:#ff0055;--glow:rgba(255,0,85,.4);--glass:rgba(23,11,28,.8);--border:rgba(255,0,85,.3);--txt:#ffe600;--sub:#f472b6}
:root[data-theme=galaxy]{--p:#a855f7;--glow:rgba(168,85,247,.4);--glass:rgba(15,10,30,.8);--border:rgba(168,85,247,.3);--txt:#f3e8ff;--sub:#c084fc}
:root[data-theme=matrix]{--p:#22c55e;--glow:rgba(34,197,94,.4);--glass:rgba(5,20,10,.8);--border:rgba(34,197,94,.3);--txt:#86efac;--sub:#4ade80}
:root[data-theme=gold]{--p:#f59e0b;--glow:rgba(245,158,11,.4);--glass:rgba(24,18,9,.8);--border:rgba(245,158,11,.3);--txt:#fef3c7;--sub:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#030712;color:var(--txt);height:100dvh;overflow:hidden;display:flex;justify-content:center}
#canvas-3d{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(24px);border-inline:1px solid var(--border);box-shadow:0 0 50px #000}
header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{font-weight:900;color:var(--p);text-shadow:0 0 12px var(--glow);display:flex;gap:9px;align-items:center}
.nav{display:flex;gap:9px}.icon{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:#ffffff0c;color:var(--txt);font-size:1.05rem}
button{cursor:pointer}.icon:active,.glass:active{background:var(--p);color:#000}
.hero{padding:15px 20px 8px;display:flex;flex-direction:column;align-items:center}
.art{width:164px;height:164px;position:relative;display:grid;place-items:center;margin-bottom:12px}
#visualizer{position:absolute;inset:0;width:100%;height:100%}
.disc{width:124px;height:124px;border-radius:50%;border:3px solid var(--border);display:grid;place-items:center;background:radial-gradient(circle,#33415555,#000);box-shadow:0 0 30px var(--glow);z-index:1}
.disc i{font-size:3rem;color:var(--p)}
.details{text-align:center;width:100%;margin-bottom:12px}.title{font-size:1.2rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:.82rem;color:var(--sub);margin-top:4px}
.scrub{width:100%;padding:0 8px;margin-bottom:10px}.track{height:20px;display:flex;align-items:center;touch-action:pan-y}.rail{height:6px;width:100%;background:#ffffff20;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:var(--p);box-shadow:0 0 12px var(--p)}.times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sub)}
.controls{width:100%;display:flex;justify-content:space-around;align-items:center;margin:5px 0 10px}.play{width:62px;height:62px;border:0;border-radius:50%;background:var(--p);color:#000;font-size:1.5rem;box-shadow:0 0 25px var(--glow)}
.actions,.filters{display:flex;gap:9px;padding:8px 18px}.library-tabs{display:flex;gap:8px;padding:7px 18px 2px}.library-tab{flex:1;padding:9px;border-radius:12px;border:1px solid var(--border);background:#ffffff0a;color:var(--sub);font-weight:700}.library-tab.active{background:var(--p);color:#001018;box-shadow:0 0 14px var(--glow)}.glass,.select{flex:1;background:#ffffff0a;border:1px solid var(--border);border-radius:13px;color:var(--txt);padding:10px;font-size:.78rem;text-align:center}
.select{background:#101827}.playlist{flex:1;overflow:auto;padding:4px 18px 18px}.item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#ffffff08;border:1px solid #ffffff12;border-radius:15px;margin:7px 0;color:var(--txt);text-align:right}.item.active{border-color:var(--p);box-shadow:0 0 14px var(--glow);background:#ffffff12}.item-info{min-width:0;flex:1}.item-actions{display:flex;align-items:center;gap:7px;margin-right:10px}.track-action{border:0;background:transparent;color:var(--sub);font-size:1rem;padding:7px}.track-action.fav{color:#ff4d9d}.item-name{font-size:.84rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:.68rem;color:var(--sub);margin-top:4px}
.sheet,.car{position:fixed;z-index:5;inset:auto 0 0;background:#080e1af2;backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:18px;max-height:85dvh;overflow:auto;transform:translateY(110%);transition:transform .3s}.sheet.open,.car.open{transform:translateY(0)}
.sheet-head,.car-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-weight:800}.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.knob{border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center;font-size:.72rem}.knob input{width:100%;accent-color:var(--p);margin-top:8px}.eq{display:flex;justify-content:space-between;gap:3px;padding:12px 5px;background:#0006;border:1px solid var(--border);border-radius:16px}.eqcol{display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:var(--sub);flex:1}.eqcol input{writing-mode:vertical-lr;direction:rtl;width:12px;height:100px;accent-color:var(--p);margin:8px 0}
.car{inset:0;border-radius:0;max-height:none;display:flex;flex-direction:column;gap:22px;background:#030712;padding:22px}.car-head{border-bottom:1px solid var(--border);padding-bottom:14px}.car-title{text-align:center;font-size:1.5rem;font-weight:900}.car-artist{text-align:center;color:var(--p)}.volume{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--border);border-radius:18px}.volume input{flex:1;accent-color:var(--p)}.bigcontrols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bigcontrols button{height:90px;border-radius:24px;border:2px solid var(--border);background:#ffffff0c;color:white;font-size:2rem}.bigcontrols .playbig{height:105px;background:var(--p);color:#000;font-size:2.7rem}.seek{display:flex;gap:12px}.seek button{flex:1;padding:18px;border-radius:17px;background:#ffffff0b;border:1px solid var(--border);color:var(--txt)}
input[type=file]{display:none}
</style></head>
<body><canvas id="canvas-3d"></canvas><main class="app">
<header><div class="brand"><i class="fa-solid fa-record-vinyl"></i>AuraSound 3D</div><div class="nav"><button class="icon" id="car-open"><i class="fa-solid fa-car"></i></button><button class="icon" id="eq-open"><i class="fa-solid fa-sliders"></i></button></div></header>
<section class="hero"><div class="art"><canvas id="visualizer"></canvas><div class="disc"><i class="fa-solid fa-compact-disc"></i></div></div>
<div class="details"><div class="title" id="title">فایلی انتخاب نشده</div><div class="artist" id="artist">یک آهنگ انتخاب کنید</div></div>
<div class="scrub"><div class="track" id="progress"><div class="rail"><div class="fill" id="fill"></div></div></div><div class="times"><span id="now">00:00</span><span id="duration">00:00</span></div></div>
<div class="controls"><button class="icon" id="shuffle"><i class="fa-solid fa-shuffle"></i></button><button class="icon" id="prev"><i class="fa-solid fa-backward-step"></i></button><button class="play" id="play"><i class="fa-solid fa-play"></i></button><button class="icon" id="next"><i class="fa-solid fa-forward-step"></i></button><button class="icon" id="repeat"><i class="fa-solid fa-repeat"></i></button></div></section>
<div class="library-tabs"><button class="library-tab active" id="all-tab">همه آهنگ‌ها</button><button class="library-tab" id="fav-tab"><i class="fa-solid fa-heart"></i> علاقه‌مندی‌ها</button></div><div class="filters"><select class="select" id="sort"><option value="default">مرتب‌سازی پیش‌فرض</option><option value="name">نام آهنگ</option><option value="size">حجم فایل</option><option value="date">تاریخ افزودن</option><option value="album">پوشه / آلبوم</option></select><select class="select" id="theme"><option value="neon">نئون سیان</option><option value="cyberpunk">سایبرپانک</option><option value="galaxy">کهکشان</option><option value="matrix">ماتریکس</option><option value="gold">طلایی</option></select></div>
<div class="playlist" id="list"></div></main>
<section class="sheet" id="sheet"><div class="sheet-head"><span><i class="fa-solid fa-sliders" style="color:var(--p)"></i> بیس و اکولایزر</span><button class="icon" id="eq-close"><i class="fa-solid fa-xmark"></i></button></div>
<div class="knobs"><div class="knob">آمپلی‌فایر<input id="amp" type="range" min="1" max="4" step=".1" value="1"><div id="ampv">1.0x</div></div><div class="knob">بیس<input id="bass" type="range" min="-12" max="15" value="3"><div id="bassv">+3 dB</div></div><div class="knob">صدای زیر<input id="treble" type="range" min="-12" max="12" value="0"><div id="treblev">0 dB</div></div></div><div class="eq" id="eq"></div><button class="glass" id="eq-reset" style="width:100%;margin-top:14px"><i class="fa-solid fa-rotate-left"></i> بازگشت اکولایزر به تنظیمات اولیه</button></section>
<section class="car" id="car"><div class="car-head"><span>حالت رانندگی ایمن</span><button class="icon" id="car-close"><i class="fa-solid fa-xmark"></i></button></div><div class="car-title" id="ctitle">فایلی انتخاب نشده</div><div class="car-artist" id="cartist">کنترل ساده و درشت</div><div class="seek"><button id="car-fav"><i class="fa-regular fa-heart"></i> علاقه‌مندی</button><button id="car-share"><i class="fa-solid fa-share-nodes"></i> اشتراک‌گذاری</button></div><div class="volume"><i class="fa-solid fa-volume-low"></i><input id="volume" type="range" min="0" max="1" step=".01" value="1"><i class="fa-solid fa-volume-high"></i></div><div class="bigcontrols"><button id="cprev"><i class="fa-solid fa-backward"></i></button><button class="playbig" id="cplay"><i class="fa-solid fa-play"></i></button><button id="cnext"><i class="fa-solid fa-forward"></i></button></div><div class="seek"><button id="back10">↶ ۱۰ ثانیه</button><button id="forward10">۱۰ ثانیه ↷</button></div></section>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id), audio=$('audio');let tracks=[],index=-1,playing=false,shuffle=false,repeat=false,currentView="all",ctx,analyser,gain,bass,treble,eqFilters=[],nativeActive=false;const favorites=new Set(JSON.parse(localStorage.getItem("aurasound_favorites")||"[]"));function saveFavorites(){localStorage.setItem("aurasound_favorites",JSON.stringify([...favorites]))}function shareTrack(i){const t=tracks[i];if(!t)return;if(window.AuraNative&&t.url.startsWith("content:"))window.AuraNative.shareTrack(t.name,t.url);else if(navigator.share)navigator.share({title:t.name,text:t.name}).catch(()=>{});}
const freqs=[31,62,125,250,500,1000,2000,4000,8000,16000];const eq=$('eq');
freqs.forEach((f,i)=>{const d=document.createElement('label');d.className='eqcol';d.innerHTML='<span>'+ (f>=1000?f/1000+'k':f) +'</span><input type="range" min="-12" max="12" value="0" data-i="'+i+'"><span>0</span>';eq.appendChild(d)});
function initAudio(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;gain=ctx.createGain();bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=80;treble=ctx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=3500;eqFilters=freqs.map(f=>{let n=ctx.createBiquadFilter();n.type='peaking';n.frequency.value=f;n.Q.value=1.4;return n});const source=ctx.createMediaElementSource(audio);source.connect(gain);gain.connect(bass);bass.connect(treble);let n=treble;eqFilters.forEach(f=>{n.connect(f);n=f});n.connect(analyser);analyser.connect(ctx.destination);drawVisualizer()}
function fmt(t){if(!isFinite(t))return'00:00';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function setPlay(v){playing=v;$('play').innerHTML='<i class="fa-solid fa-'+(v?'pause':'play')+'"></i>';$('cplay').innerHTML='<i class="fa-solid fa-'+(v?'pause':'play')+'"></i>'}
async function toggle(){if(index<0)return;if(nativeActive&&window.AuraNative){window.AuraNative.toggleNative();return}audio.muted=false;audio.volume=Math.max(0,Math.min(1,Number($("volume").value)||1));if(audio.paused){try{initAudio();if(ctx&&ctx.state==="suspended")await ctx.resume();await audio.play();setPlay(true)}catch(e){setPlay(false);console.error("Audio playback failed:",e)}}else{audio.pause();setPlay(false)}}
function load(i,autoplay=true){if(!tracks.length)return;i=(i+tracks.length)%tracks.length;index=i;const t=tracks[i];audio.src=t.url;$('title').textContent=t.name;$('artist').textContent=t.album+' • '+(t.size/1048576).toFixed(1)+' MB';$('ctitle').textContent=t.name;$('cartist').textContent=t.album;render();updateCarActions();if(autoplay)toggle()}
function addFiles(files,album='حافظه دستگاه'){Array.from(files).filter(f=>f.type.startsWith('audio/')).forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,''),album,size:f.size,date:f.lastModified,url:URL.createObjectURL(f)}));sort();if(index<0&&tracks.length)load(0,false)}
function sort(){const mode=$('sort').value;if(mode==='name')tracks.sort((a,b)=>a.name.localeCompare(b.name,'fa'));if(mode==='size')tracks.sort((a,b)=>b.size-a.size);if(mode==='date')tracks.sort((a,b)=>b.date-a.date);if(mode==='album')tracks.sort((a,b)=>a.album.localeCompare(b.album,'fa'));render()}
function render(){$("list").replaceChildren();const visible=tracks.map((t,i)=>({t,i})).filter(x=>currentView==="all"||favorites.has(x.t.url));if(!visible.length){const empty=document.createElement("div");empty.className="meta";empty.style="text-align:center;padding:28px 8px;font-size:.85rem";empty.textContent=currentView==="favorites"?"هنوز آهنگی به علاقه‌مندی‌ها اضافه نشده است":"هنوز آهنگی شناسایی نشده است";$("list").append(empty);return}visible.forEach(({t,i})=>{const b=document.createElement('div');b.className='item'+(i===index?' active':'');const info=document.createElement('div');info.className='item-info';const name=document.createElement('div');name.className='item-name';name.textContent=t.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=t.album+' • '+(t.size/1048576).toFixed(1)+' MB';info.append(name,meta);const actions=document.createElement("div");actions.className="item-actions";const fav=document.createElement("button");fav.className="track-action"+(favorites.has(t.url)?" fav":"");fav.innerHTML='<i class="fa-'+(favorites.has(t.url)?"solid":"regular")+' fa-heart"></i>';fav.onclick=e=>{e.stopPropagation();favorites.has(t.url)?favorites.delete(t.url):favorites.add(t.url);saveFavorites();render();updateCarActions()};const share=document.createElement("button");share.className="track-action";share.innerHTML='<i class="fa-solid fa-share-nodes"></i>';share.onclick=e=>{e.stopPropagation();shareTrack(i)};actions.append(fav,share);const ico=document.createElement("i");ico.className="fa-solid fa-music";b.append(info,actions,ico);b.onclick=()=>load(i);$("list").append(b)})}
window.loadNativeTracks=function(items){const known=new Set(tracks.map(t=>t.url));items.forEach(t=>{if(!known.has(t.url))tracks.push({name:t.name,album:(t.artist&&t.artist!=='ناشناخته'?t.artist+' • ':'')+t.album,size:+t.size||0,date:+t.date||0,url:t.url})});sort();if(index<0&&tracks.length)load(0,false)};
$('play').onclick=$('cplay').onclick=toggle;$('next').onclick=$('cnext').onclick=()=>{if(nativeActive&&window.AuraNative&&!shuffle)window.AuraNative.nextNative();else load(shuffle?Math.floor(Math.random()*tracks.length):index+1)};$('prev').onclick=$('cprev').onclick=()=>{if(nativeActive&&window.AuraNative)window.AuraNative.prevNative();else load(index-1)};$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').style.color=shuffle?'var(--p)':''};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').style.color=repeat?'var(--p)':''};audio.onended=()=>{if(repeat){audio.currentTime=0;audio.play()}else if(index<tracks.length-1||shuffle)load(shuffle?Math.floor(Math.random()*tracks.length):index+1);else setPlay(false)};
audio.ontimeupdate=()=>{$('fill').style.width=(audio.currentTime/(audio.duration||1)*100)+'%';$('now').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration)};
$('progress').onclick=e=>{if(audio.duration){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration}};
$('sort').onchange=sort;$('theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;const colors={neon:0x00f0ff,cyberpunk:0xff0055,galaxy:0xa855f7,matrix:0x22c55e,gold:0xf59e0b};if(points)points.material.color.setHex(colors[e.target.value])};
$('eq-open').onclick=()=>$('sheet').classList.add('open');$('eq-close').onclick=()=>$('sheet').classList.remove('open');$('car-open').onclick=()=>$('car').classList.add('open');$('car-close').onclick=()=>$('car').classList.remove('open');
function resetEqualizer(){$("amp").value=1;$("bass").value=3;$("treble").value=0;$("ampv").textContent="1.0x";$("bassv").textContent="+3 dB";$("treblev").textContent="0 dB";if(gain)gain.gain.value=1;if(bass)bass.gain.value=3;if(treble)treble.gain.value=0;eq.querySelectorAll("input[type=range]").forEach((el,i)=>{el.value=0;el.nextElementSibling.textContent="0";if(eqFilters[i])eqFilters[i].gain.value=0})}$("eq-reset").onclick=resetEqualizer;$("all-tab").onclick=()=>{currentView="all";$("all-tab").classList.add("active");$("fav-tab").classList.remove("active");render()};$("fav-tab").onclick=()=>{currentView="favorites";$("fav-tab").classList.add("active");$("all-tab").classList.remove("active");render()};$("amp").oninput=e=>{if(gain)gain.gain.value=+e.target.value;$('ampv').textContent=(+e.target.value).toFixed(1)+'x'};$('bass').oninput=e=>{if(bass)bass.gain.value=+e.target.value;$('bassv').textContent=(e.target.value>0?'+':'')+e.target.value+' dB'};$('treble').oninput=e=>{if(treble)treble.gain.value=+e.target.value;$('treblev').textContent=e.target.value+' dB'};
eq.oninput=e=>{if(e.target.dataset.i!==undefined){const i=+e.target.dataset.i;if(eqFilters[i])eqFilters[i].gain.value=+e.target.value;e.target.nextElementSibling.textContent=e.target.value}};
function updateCarActions(){const t=tracks[index],f=$('car-fav');if(!f)return;const yes=!!t&&favorites.has(t.url);f.innerHTML='<i class="fa-'+(yes?'solid':'regular')+' fa-heart"></i> '+(yes?'حذف از علاقه‌مندی':'علاقه‌مندی')} $('car-fav').onclick=()=>{const t=tracks[index];if(!t)return;favorites.has(t.url)?favorites.delete(t.url):favorites.add(t.url);saveFavorites();render();updateCarActions()};$('car-share').onclick=()=>shareTrack(index);$('volume').oninput=e=>audio.volume=+e.target.value;$('back10').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);$('forward10').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10);
let scene,camera,renderer,points;function init3d(){if(!window.THREE)return;const c=$('canvas-3d');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);camera.position.z=30;renderer=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});renderer.setSize(innerWidth,innerHeight);const g=new THREE.BufferGeometry(),p=new Float32Array(1500);for(let i=0;i<p.length;i++)p[i]=(Math.random()-.5)*80;g.setAttribute('position',new THREE.BufferAttribute(p,3));points=new THREE.Points(g,new THREE.PointsMaterial({color:0x00f0ff,size:.65,transparent:true,opacity:.6}));scene.add(points);function anim(){requestAnimationFrame(anim);points.rotation.y+=.0012;points.rotation.x+=.0007;renderer.render(scene,camera)}anim();window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}}
function drawVisualizer(){const c=$('visualizer'),g=c.getContext('2d');function draw(){requestAnimationFrame(draw);if(!analyser||audio.paused)return;const w=c.clientWidth,h=c.clientHeight;if(c.width!==w*devicePixelRatio||c.height!==h*devicePixelRatio){c.width=w*devicePixelRatio;c.height=h*devicePixelRatio}g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,w,h);const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);const cx=w/2,cy=h/2;for(let i=0;i<a.length;i++){const angle=i*2*Math.PI/a.length,r=62,len=a[i]/255*30;g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--p');g.lineWidth=2;g.beginPath();g.moveTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);g.lineTo(cx+Math.cos(angle)*(r+len),cy+Math.sin(angle)*(r+len));g.stroke()}}draw()}
init3d();resetEqualizer();
</script></body></html>
